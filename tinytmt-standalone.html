    <style>
:root {
  --navy: #14213d;
  --navy-2: #1d2f55;
  --ink: #1b2333;
  --muted: #667085;
  --line: #dde3ec;
  --panel: #ffffff;
  --bg: #f3f5f9;
  --accent: #2f7cf6;
  --accent-soft: #e6efff;
  --green: #2e9e6a;
  --amber: #e69500;
  --red: #d64545;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 4px 12px rgba(16, 24, 40, .06);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color: var(--ink);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { display: grid; grid-template-rows: 52px 1fr 44px; background: var(--bg); overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
kbd { font: 11px ui-monospace, Menlo, Consolas, monospace; background: #eef1f6; border: 1px solid #d3d9e3; border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: #475467; }

/* Top bar */
.topbar { display: flex; align-items: center; gap: 16px; padding: 0 12px; background: var(--navy); color: #fff; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark { width: 30px; height: 30px; }
.brand-text { line-height: 1.05; white-space: nowrap; }
.brand-text strong { font-size: 16px; letter-spacing: .2px; }
.brand-text span { font-size: 14px; opacity: .85; }
.brand-text small { display: block; font-size: 11px; opacity: .65; }
.title-wrap { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; min-width: 0; }
.track-title { width: min(440px, 100%); background: transparent; border: 1px solid transparent; color: #fff; font-size: 17px; font-weight: 600; text-align: center; padding: 6px 10px; border-radius: 8px; }
.track-title:hover { border-color: rgba(255,255,255,.2); }
.track-title:focus { outline: none; background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.4); }
.dirty-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); visibility: hidden; }
.dirty-dot.on { visibility: visible; }
.actions { display: flex; align-items: center; gap: 6px; }
.btn { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); color: #fff; padding: 6px 12px; border-radius: 8px; font-size: 13px; }
.btn:hover { background: rgba(255,255,255,.16); }
.btn.primary { background: var(--accent); border-color: var(--accent); }
.icon-btn { background: transparent; border: 1px solid transparent; color: inherit; width: 32px; height: 32px; border-radius: 8px; font-size: 16px; display: inline-grid; place-items: center; }
.icon-btn:hover { background: rgba(127,127,127,.15); }
.addon-btn { display: inline-flex; align-items: center; gap: 6px; }
.pill { font-size: 10px; text-transform: uppercase; letter-spacing: .5px; background: var(--amber); color: #1b1300; border-radius: 99px; padding: 1px 6px; font-weight: 700; }
.menu { position: relative; }
.menu-list { position: absolute; right: 0; top: calc(100% + 6px); background: #fff; color: var(--ink); border-radius: 10px; box-shadow: 0 12px 32px rgba(0,0,0,.18); padding: 6px; min-width: 230px; z-index: 30; }
.menu-list button { display: flex; justify-content: space-between; width: 100%; text-align: left; padding: 8px 10px; background: none; border: 0; border-radius: 6px; font-size: 13px; }
.menu-list button:hover { background: var(--accent-soft); }
.menu-list hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }

/* Layout */
.layout { display: grid; grid-template-columns: 250px 1fr 320px; min-height: 0; }
.palette, .side { background: var(--panel); min-height: 0; overflow: auto; }
.palette { border-right: 1px solid var(--line); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.side { border-left: 1px solid var(--line); display: flex; flex-direction: column; }
.palette-controls { display: grid; gap: 8px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: #eef1f6; border-radius: 8px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 6px 4px; border-radius: 6px; font-size: 12.5px; color: #475467; }
.seg button.on { background: #fff; color: var(--ink); box-shadow: var(--shadow); font-weight: 600; }
#partSearch { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; font-size: 13px; }
.palette-groups { display: grid; gap: 6px; }
.pgroup > summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); padding: 6px 2px; }
.pgroup > summary::-webkit-details-marker { display: none; }
.pgroup > summary::before { content: '▸'; margin-right: 6px; transition: transform .15s; }
.pgroup[open] > summary::before { transform: rotate(90deg); }
.pgroup > summary .grp-label { flex: 1; }
.pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.pcard { position: relative; border: 1px solid var(--line); border-left: 4px solid var(--fam, var(--line)); background: #fbfcfe; border-radius: 9px; padding: 6px 6px 5px; text-align: left; touch-action: none; user-select: none; transition: border-color .1s, box-shadow .1s, transform .08s; }
.pcard:hover { border-color: #b8c6dc; box-shadow: var(--shadow); }
.pcard:active { transform: scale(.98); }
.pcard.on { border-color: var(--fam, var(--accent)); background: var(--fam-soft, var(--accent-soft)); box-shadow: 0 0 0 2px var(--fam, var(--accent)); }
.pbody { display: grid; gap: 4px; }
.psub { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600; color: #344054; margin: 6px 0 2px; }
.psub i { width: 10px; height: 10px; border-radius: 3px; background: var(--fam); flex: none; }
.psub small { margin-left: auto; font-weight: 500; color: var(--muted); font-size: 10.5px; }
.pcard canvas { width: 100%; height: 52px; display: block; }
.pcard .pname { font-size: 11.5px; font-weight: 600; line-height: 1.2; margin-top: 3px; }
.pcard .pmeta { font-size: 10.5px; color: var(--muted); }
.pcard .pdef { position: absolute; top: 4px; right: 5px; font-size: 8.5px; font-weight: 700; color: #fff; background: var(--fam, var(--green)); border-radius: 4px; padding: 0 4px; }
.palette-tip { font-size: 11.5px; color: var(--muted); margin: 4px 0 0; line-height: 1.4; }

/* Stage */
.stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
#canvas { width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
.toolbar { position: absolute; top: 10px; left: 10px; display: flex; align-items: center; gap: 2px; background: #fff; border-radius: 10px; box-shadow: var(--shadow); padding: 4px; z-index: 5; }
.tool { min-width: 32px; height: 32px; border: 0; background: transparent; border-radius: 7px; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 5px; padding: 0 7px; color: #344054; }
.tool span { font-size: 12.5px; }
.tool:hover { background: #f0f3f8; }
.tool.on { background: var(--accent-soft); color: var(--accent); }
.tool:disabled { opacity: .35; cursor: default; }
.tool.zoom-label { font-size: 12px; min-width: 52px; font-variant-numeric: tabular-nums; }
.sep { width: 1px; height: 20px; background: var(--line); margin: 0 3px; }
.hud { position: absolute; left: 10px; bottom: 10px; z-index: 5; background: rgba(20,33,61,.88); color: #fff; font-size: 12px; padding: 7px 10px; border-radius: 8px; pointer-events: none; max-width: 70%; line-height: 1.5; }
.hud b { color: #9cc3ff; }
.hud kbd { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.25); color: #fff; }

/* Side panel */
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; background: none; border: 0; padding: 12px 6px; font-size: 13px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
.tab-body { padding: 12px; overflow: auto; }
.bom-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.bom-table th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); font-weight: 700; padding: 6px 4px; border-bottom: 1px solid var(--line); }
.bom-table td { padding: 7px 4px; border-bottom: 1px solid #eef1f6; vertical-align: top; }
.bom-table td.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bom-table tfoot td { font-weight: 700; border-top: 2px solid var(--line); border-bottom: 0; }
.bom-table .sub { display: block; font-size: 11px; color: var(--muted); }
.bom-table a { color: var(--accent); text-decoration: none; }
.qty { display: inline-block; min-width: 26px; text-align: center; background: var(--navy); color: #fff; border-radius: 6px; font-weight: 700; padding: 1px 4px; }
.note { font-size: 11.5px; color: var(--muted); line-height: 1.45; }
.empty { text-align: center; color: var(--muted); font-size: 13px; padding: 30px 10px; }
.kv { display: grid; grid-template-columns: 110px 1fr; gap: 6px 10px; font-size: 13px; align-items: center; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.row-btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.sbtn { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; }
.sbtn:hover { border-color: #b8c6dc; background: #f8fafc; }
.sbtn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.sbtn.danger { color: var(--red); }

/* Status bar */
.statusbar { display: flex; align-items: center; gap: 4px; padding: 0 10px; background: #fff; border-top: 1px solid var(--line); font-size: 12.5px; overflow: hidden; }
.stat { display: flex; align-items: baseline; gap: 7px; padding: 0 12px; border-right: 1px solid var(--line); white-space: nowrap; }
.stat span { color: var(--muted); }
.stat strong { font-variant-numeric: tabular-nums; font-size: 14px; }
.stat-flags { gap: 6px; border-right: 0; }
.flag { font-size: 11.5px; padding: 2px 8px; border-radius: 99px; background: #eef1f6; color: #475467; }
.flag.ok { background: #e3f5ec; color: #1d7a4f; }
.flag.warn { background: #fff3db; color: #8a5a00; }
.flag.bad { background: #fde7e7; color: #a32727; }
.stat-right { margin-left: auto; border-right: 0; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Modal */
.modal-backdrop { position: fixed; inset: 0; background: rgba(16, 24, 40, .45); display: grid; place-items: center; z-index: 50; padding: 20px; }
.modal { background: #fff; border-radius: 14px; width: min(860px, 100%); max-height: 88vh; display: flex; flex-direction: column; box-shadow: 0 24px 64px rgba(0,0,0,.3); }
.modal.small { width: min(440px, 100%); }
.modal > header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.modal h2 { font-size: 16px; margin: 0; }
.modal-body { padding: 16px 18px; overflow: auto; font-size: 13.5px; line-height: 1.5; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); }
.modal-foot:empty { display: none; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px 16px; }
.field { display: grid; gap: 4px; font-size: 12.5px; }
.field label { font-weight: 600; }
.field small { color: var(--muted); font-size: 11px; }
.field input, .field select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 7px; font: inherit; font-size: 13px; }
.field.check { grid-template-columns: auto 1fr; align-items: center; }
.settings-tabs { display: flex; gap: 4px; margin-bottom: 14px; flex-wrap: wrap; }
.settings-tabs button { border: 1px solid var(--line); background: #fff; border-radius: 99px; padding: 5px 12px; font-size: 12.5px; }
.settings-tabs button.on { background: var(--navy); color: #fff; border-color: var(--navy); }
.parts-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.parts-table th, .parts-table td { padding: 4px; border-bottom: 1px solid #eef1f6; text-align: left; }
.parts-table input[type=number] { width: 70px; padding: 3px 5px; border: 1px solid var(--line); border-radius: 5px; font: inherit; }
.parts-table input[type=text] { width: 150px; padding: 3px 5px; border: 1px solid var(--line); border-radius: 5px; font: inherit; }
.lib-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.lib-card { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
.lib-card img { width: 100%; aspect-ratio: 4/3; object-fit: cover; background: #0f4c81; display: block; }
.lib-card .meta { padding: 8px 10px; font-size: 12px; color: var(--muted); }
.lib-card .meta strong { display: block; color: var(--ink); font-size: 13.5px; margin-bottom: 2px; }
.lib-card .row-btns { padding: 0 10px 10px; margin-top: 0; }
.shortcuts { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 4px 24px; }
.shortcuts div { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-bottom: 1px dashed #eef1f6; font-size: 13px; }

.toast { position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 9px 16px; border-radius: 10px; font-size: 13px; z-index: 60; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.drag-ghost { position: fixed; pointer-events: none; z-index: 70; background: var(--accent); color: #fff; font-size: 12px; font-weight: 600; padding: 4px 9px; border-radius: 99px; transform: translate(12px, 12px); }

@media (max-width: 1100px) {
  .layout { grid-template-columns: 210px 1fr 270px; }
  .brand-text span, .brand-text small { display: none; }
}
@media (max-width: 800px) {
  .layout { grid-template-columns: 1fr; grid-template-rows: 1fr 170px; }
  .palette { grid-row: 2; border: 0; border-top: 1px solid var(--line); }
  .pgrid { grid-template-columns: repeat(4, 1fr); }
  .title-wrap { display: none; }
  .side { display: none; }
  .actions .btn { padding: 6px 8px; }
}

</style>
</head>
<body>
  <header class="topbar">
    <div class="brand" title="TinyTMT track designer by SalvageGarden Makerspace">
      <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+CiAgPHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0IiByeD0iMTQiIGZpbGw9IiMxNDIxM2QiLz4KICA8cGF0aCBkPSJNMTAgNDYgSDMwIEExNiAxNiAwIDAgMCA0NiAzMCBWMTIiIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzJlOWU2YSIgc3Ryb2tlLXdpZHRoPSIxMiIgc3Ryb2tlLWxpbmVjYXA9ImJ1dHQiLz4KICA8cGF0aCBkPSJNMTAgNDYgSDMwIEExNiAxNiAwIDAgMCA0NiAzMCBWMTIiIGZpbGw9Im5vbmUiIHN0cm9rZT0iI2RjZTdmYiIgc3Ryb2tlLXdpZHRoPSIyIiBzdHJva2UtZGFzaGFycmF5PSIzIDMiLz4KICA8Y2lyY2xlIGN4PSIyMCIgY3k9IjIyIiByPSI4IiBmaWxsPSJub25lIiBzdHJva2U9IiNmZmQ2NzgiIHN0cm9rZS13aWR0aD0iMy41Ii8+CiAgPGNpcmNsZSBjeD0iMjAiIGN5PSIyMiIgcj0iMiIgZmlsbD0iI2ZmZDY3OCIvPgo8L3N2Zz4K" alt="" class="brand-mark" />
      <div class="brand-text">
        <strong>TinyTMT</strong> <span>track designer</span>
        <small>by SalvageGarden Makerspace</small>
      </div>
    </div>

    <div class="title-wrap">
      <input id="trackTitle" class="track-title" type="text" spellcheck="false" aria-label="Track title" maxlength="80" />
      <button class="icon-btn" id="btnRerollTitle" title="New random title" aria-label="New random title">🎲</button>
      <span class="dirty-dot" id="dirtyDot" title="Unsaved changes"></span>
    </div>

    <nav class="actions" aria-label="File">
      <button class="btn" id="btnNew" title="New design">New</button>
      <button class="btn" id="btnOpen" title="Open saved designs (Ctrl+O)">Open</button>
      <button class="btn" id="btnSave" title="Save to this browser (Ctrl+S)">Save</button>
      <div class="menu">
        <button class="btn" id="btnExport" aria-haspopup="true" aria-expanded="false">Export ▾</button>
        <div class="menu-list" id="exportMenu" role="menu" hidden>
          <button role="menuitem" data-export="png">Blueprint PNG <kbd>Ctrl E</kbd></button>
          <button role="menuitem" data-export="json">Design file (.json)</button>
          <button role="menuitem" data-export="csv">BoM (.csv)</button>
          <hr />
          <button role="menuitem" data-export="import">Import design file…</button>
        </div>
      </div>
      <span class="addon-slot" id="addonSlot"></span>
      <button class="icon-btn" id="btnSettings" title="Settings" aria-label="Settings">⚙</button>
      <div class="menu">
        <button class="icon-btn" id="btnHelp" title="Help" aria-label="Help" aria-haspopup="true" aria-expanded="false">?</button>
        <div class="menu-list" id="helpMenu" role="menu" hidden>
          <button role="menuitem" data-help="help">How to &amp; shortcuts <kbd>?</kbd></button>
          <button role="menuitem" data-help="samples">Sample tracks…</button>
          <hr />
          <button role="menuitem" data-help="repo">Source on GitHub ↗</button>
        </div>
      </div>
    </nav>
  </header>

  <main class="layout">
    <aside class="palette" aria-label="Track pieces">
      <div class="palette-controls">
        <div class="seg" role="radiogroup" aria-label="Track width">
          <button data-width="single" class="on" title="Single lane (W)">Single</button>
          <button data-width="double" title="Double width, no lane separator (W)">Double</button>
        </div>
        <div class="seg" role="radiogroup" aria-label="Curve direction">
          <button data-dir="L" title="Curve left (F)">↰ Left</button>
          <button data-dir="R" class="on" title="Curve right (F)">Right ↱</button>
        </div>
        <input type="search" id="partSearch" placeholder="Filter pieces…" aria-label="Filter pieces" />
      </div>
      <div id="paletteGroups" class="palette-groups"></div>
      <p class="palette-tip">Click a piece then click the grid, or drag it onto the canvas. Pieces snap to open track ends.</p>
    </aside>

    <section class="stage" aria-label="Design canvas">
      <div class="toolbar" role="toolbar" aria-label="Tools">
        <button class="tool" data-tool="select" title="Select & move (V)">⬉<span>Select</span></button>
        <button class="tool on" data-tool="place" title="Place pieces (P)">✚<span>Place</span></button>
        <span class="sep"></span>
        <button class="tool" id="tRotate" title="Rotate (R / Shift+R)">⟳</button>
        <button class="tool" id="tFlip" title="Flip curve direction (F)">⇋</button>
        <button class="tool" id="tDelete" title="Delete (Del)">🗑</button>
        <span class="sep"></span>
        <button class="tool" id="tUndo" title="Undo (Ctrl+Z)">↶</button>
        <button class="tool" id="tRedo" title="Redo (Ctrl+Shift+Z)">↷</button>
        <span class="sep"></span>
        <button class="tool" id="tZoomOut" title="Zoom out (-)">−</button>
        <button class="tool zoom-label" id="tZoomFit" title="Zoom to fit (0)">100%</button>
        <button class="tool" id="tZoomIn" title="Zoom in (+)">+</button>
      </div>
      <div class="hud" id="hud"></div>
      <canvas id="canvas" tabindex="0" aria-label="Track design canvas"></canvas>
    </section>

    <aside class="side" aria-label="Details">
      <div class="tabs" role="tablist">
        <button role="tab" class="on" data-tab="bom">Bill of materials</button>
        <button role="tab" data-tab="inspect">Inspector</button>
      </div>
      <div class="tab-body" id="tab-bom"></div>
      <div class="tab-body" id="tab-inspect" hidden></div>
    </aside>
  </main>

/*
 * TinyTMT geometry. Units: millimetres. World axes: +x right, +y down (screen).
 * Heading `a` in degrees: 0 = +x, positive = clockwise on screen.
 * A placed piece stores its ENTRY pose {x, y, a} and entry elevation z.
 */
(function (root) {
  const D2R = Math.PI / 180;
  const norm = (a) => ((a % 360) + 360) % 360;
  const angDiff = (a, b) => { const d = norm(a - b); return d > 180 ? 360 - d : d; };
  const rot = (x, y, a) => { const r = a * D2R, c = Math.cos(r), s = Math.sin(r); return { x: x * c - y * s, y: x * s + y * c }; };

  const solveEntry = (target, local) => { const a = norm(target.a - local.a); const p = rot(local.x, local.y, a); return { x: target.x - p.x, y: target.y - p.y, a }; };
  const toLocal = (pose, wx, wy) => rot(wx - pose.x, wy - pose.y, -pose.a);

  /** Overall track width for a width mode, from settings. Double = 2 lanes, no separator. */
  function trackWidth(settings, widthMode) {
    const lanes = widthMode === 'double' ? 2 : 1;
    return lanes * settings.laneWidth + 2 * settings.wallThickness;
  }

  function centerRadius(part, W) { return part.ir + W / 2; }

  /** Exit transform in the piece's local frame. */
  function exitLocal(part, dir, W) {

    const R = centerRadius(part, W), t = part.angle * D2R;
    const x = R * Math.sin(t), y = R - R * Math.cos(t);
    return dir === 'L' ? { x, y: -y, a: -part.angle } : { x, y, a: part.angle };
  }

  /** Centre-line length (what a car travels). Ramps use their sloped bed length. */
  function pieceLength(part, W) {
    if (part.type === 'straight') return part.bedLength || part.length;
    return centerRadius(part, W) * part.angle * D2R;
  }

  /** Outline as a polygon in local coords (arcs tessellated). */
  function outlineLocal(part, dir, W) {
    const h = W / 2;
    if (part.type === 'straight') return [{ x: 0, y: -h }, { x: part.length, y: -h }, { x: part.length, y: h }, { x: 0, y: h }];

    const sgn = dir === 'L' ? -1 : 1;
    const steps = part.style === 'digital' ? Math.max(2, Math.round(part.angle / 7.5)) : Math.max(6, Math.ceil(part.angle / 3));
    const pts = [];
    const at = (r, t) => ({ x: r * Math.sin(t), y: sgn * (R - r * Math.cos(t)) });
    for (let i = 0; i <= steps; i++) pts.push(at(ro, (part.angle * D2R * i) / steps));
    for (let i = steps; i >= 0; i--) pts.push(at(ri, (part.angle * D2R * i) / steps));
    return pts;
  }

  /** Points along an offset of the centre line (offset>0 = right side). */
  function railLocal(part, dir, W, offset, stepMm) {
    stepMm = stepMm || 10;
    if (part.type === 'straight') {
      const n = Math.max(1, Math.ceil(part.length / stepMm)), pts = [];
      for (let i = 0; i <= n; i++) pts.push({ x: (part.length * i) / n, y: offset, t: i / n });
      return pts;
    }
    const R = centerRadius(part, W), sgn = dir === 'L' ? -1 : 1;
    const r = R - sgn * offset; // right-turn: right side is inside
    const arc = r * part.angle * D2R;
    const n = part.style === 'digital' ? Math.max(2, Math.round(part.angle / 7.5)) : Math.max(2, Math.ceil(arc / stepMm));
    const pts = [];
    for (let i = 0; i <= n; i++) { const t = (part.angle * D2R * i) / n; pts.push({ x: r * Math.sin(t), y: sgn * (R - r * Math.cos(t)), t: i / n }); }
    return pts;
  }

  function hitLocal(part, dir, W, lx, ly) {
    const h = W / 2;
    if (part.type === 'straight') return lx >= 0 && lx <= part.length && Math.abs(ly) <= h;
    const R = centerRadius(part, W), sgn = dir === 'L' ? -1 : 1;
    const cy = sgn * R; // centre of curvature
    const dx = lx, dy = ly - cy, d = Math.hypot(dx, dy);

    let t = Math.atan2(dx, -sgn * dy); // 0 at start, increasing along travel

  function pointInPoly(pts, x, y) {
    let inside = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const a = pts[i], b = pts[j];
      if ((a.y > y) !== (b.y > y) && x < ((b.x - a.x) * (y - a.y)) / (b.y - a.y) + a.x) inside = !inside;

  }

})(window);

(function (root) {
  function draw(ctx, part, W, opts) {

    const L = part.length, wallT = opts.wallT || 3, px = opts.px || 1, col = opts.color || '#333';

    ctx.save();
    ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth = Math.max(1.2 * px, 1);

      case 'doorway': {
        const lane = opts.laneWidth || 115, n = Math.max(6, (W - 2 * wallT - (W - 2 * wallT) * 90 / lane) / 2);

        break;
      }
      case 'sill': ctx.globalAlpha = 0.85; ctx.fillRect(mid - 6, -inner, 12, 2 * inner); break;
      case 'rough': {
        ctx.globalAlpha = 0.7;
        for (let x = 25; x <= L - 25; x += 18) for (let y = -inner + 9; y <= inner - 9; y += 18) {
          const o = ((Math.round(x / 18) % 2) * 9);
          ctx.beginPath(); ctx.arc(x, y + o > inner - 4 ? y : y + o, 2.6, 0, Math.PI * 2); ctx.fill();
        }
        break;
      }
      case 'kerb': {
        ctx.globalAlpha = 0.25; ctx.fillRect(mid - 40, -inner, 80, 2 * inner); ctx.globalAlpha = 1;
        ctx.strokeRect(mid - 40, -inner, 80, 2 * inner);
        ctx.save(); ctx.beginPath(); ctx.rect(mid - 40, -inner, 80, 2 * inner); ctx.clip();
        ctx.beginPath(); for (let k = -2 * inner; k < 80 + 2 * inner; k += 14) { ctx.moveTo(mid - 40 + k, -inner); ctx.lineTo(mid - 40 + k + 2 * inner, inner); } ctx.stroke(); ctx.restore();
        break;
      }
      case 'slope': {
        ctx.globalAlpha = 0.85;
        [L * 0.25, L * 0.5, L * 0.75].forEach((x) => {
          ctx.beginPath(); ctx.moveTo(x, -inner * 0.7); ctx.lineTo(x, inner * 0.7);
          ctx.moveTo(x - 9, inner * 0.7 - 12); ctx.lineTo(x, inner * 0.7); ctx.lineTo(x + 9, inner * 0.7 - 12); ctx.stroke();

      const ov = work.partOverrides;
      const get = (p, k) => (ov[p.id] && k in ov[p.id] ? ov[p.id][k] : p[k]);
      const set = (p, k, v) => { if (work.customParts.includes(p)) p[k] = v; else { ov[p.id] = ov[p.id] || {}; ov[p.id][k] = v; } };
      body.innerHTML = `<p class="note">Show/hide pieces, choose which ones the arrow keys cycle through, and enter slicer weights/times for exact BoM numbers (single-width values; double width is scaled). Geometry edits apply to existing designs too.</p>
        <table class="parts-table"><thead><tr><th>Show</th><th title="Arrow-key cycle">Cycle</th><th>Part</th><th>Length / IR</th><th>Angle</th><th>g</th><th>min</th><th></th></tr></thead><tbody>
        ${all.map((p, i) => `<tr data-i="${i}"><td><input type="checkbox" data-k="show" ${get(p, 'hidden') ? '' : 'checked'}></td>
          <td>${p.group === 'straight' ? `<input type="checkbox" data-k="cycleStraight" ${get(p, 'cycleStraight') ? 'checked' : ''} title="←/→">` : p.type === 'curve' ? `<input type="checkbox" data-k="cycleCurve" ${get(p, 'cycleCurve') ? 'checked' : ''} title="↑/↓">` : ''}</td>
          <td>${esc(get(p, 'name'))}<br><span class="note">${p.id}${p.nominal ? ' · nominal' : ''}</span></td>
          <td><input type="number" data-k="${p.type === 'curve' ? 'ir' : 'length'}" value="${get(p, p.type === 'curve' ? 'ir' : 'length')}"></td>
          <td>${p.type === 'curve' ? `<input type="number" data-k="angle" value="${get(p, 'angle')}">` : p.rise ? `<span class="note">rise ${get(p, 'rise')}</span>` : ''}</td>
          <td><input type="number" data-k="gramsOverride" placeholder="auto" value="${get(p, 'gramsOverride') || ''}"></td>
          <td><input type="number" data-k="minutesOverride" placeholder="auto" value="${get(p, 'minutesOverride') || ''}"></td>
          <td>${work.customParts.includes(p) ? '<button class="sbtn danger" data-del>✕</button>' : ''}</td></tr>`).join('')}
        </tbody></table>
        <h3 style="font-size:14px;margin:18px 0 8px">Add a custom piece</h3>
        <div class="form-grid"><div class="field"><label>Type</label><select id="cpType"><option value="straight">Straight</option><option value="curve">Curve</option></select></div>
        <div class="field"><label>Length / inner radius (mm)</label><input id="cpLen" type="number" value="180"></div>
        <div class="field"><label>Angle (curves, °)</label><input id="cpAng" type="number" value="22.5"></div>
        <div class="field"><label>Name</label><input id="cpName" type="text" placeholder="auto"></div></div>
        <div class="row-btns"><button class="sbtn primary" id="cpAdd">Add piece</button><button class="sbtn danger" id="cpReset">Reset all part edits</button></div>`;
      $$('tbody tr', body).forEach((tr) => {
        const p = all[+tr.dataset.i];
        $$('input', tr).forEach((inp) => (inp.onchange = () => {
          const k = inp.dataset.k;
          if (k === 'show') set(p, 'hidden', !inp.checked);
          else if (inp.type === 'checkbox') set(p, k, inp.checked);
          else { const v = parseFloat(inp.value); set(p, k, isFinite(v) && v > 0 ? v : (k.endsWith('Override') ? 0 : p[k])); }
        }));
        const del = $('[data-del]', tr); if (del) del.onclick = () => { work.customParts.splice(work.customParts.indexOf(p), 1); showParts(); };
      });
      $('#cpAdd', body).onclick = () => {
        const type = $('#cpType', body).value, len = parseFloat($('#cpLen', body).value), ang = parseFloat($('#cpAng', body).value);
        if (!(len > 0) || (type === 'curve' && !(ang > 0 && ang <= 180))) return toast('Enter a valid size.');
        const id = type === 'curve' ? `X-C${ang}-R${len}` : `X-S${len}`;
        if (all.some((p) => p.id === id)) return toast('That piece already exists.');
        work.customParts.push(type === 'curve'
          ? { id, name: $('#cpName', body).value || `Curve ${ang}° IR${len}`, type, group: 'curve', ir: len, angle: ang, style: 'smooth', source: 'custom', cycleCurve: true }
          : { id, name: $('#cpName', body).value || `Straight ${len}`, type, group: 'straight', length: len, source: 'custom', cycleStraight: true });
        showParts();
      };
      $('#cpReset', body).onclick = () => { work.partOverrides = {}; showParts(); };
    }
    node.addEventListener('click', (e) => { const b = e.target.closest('.settings-tabs button'); if (b) showTab(b.dataset.t); });
    showTab('General');
    modal({
      title: 'Settings', node, buttons: [
        { label: 'Reset to defaults', danger: true, onClick: () => { Object.assign(work, clone(DEFAULT_SETTINGS)); showTab('General'); toast('Defaults restored — press Save to apply.'); return false; } },
        { label: 'Cancel' },
        { label: 'Save', primary: true, onClick: () => applySettings(work) }
      ]
    });
  }
  function applySettings(work) {
    ['workspaceW', 'workspaceH', 'gridSize', 'laneWidth', 'wallHeight', 'density', 'filamentDiameter', 'gramsPerHour'].forEach((k) => { if (!(work[k] > 0)) work[k] = DEFAULT_SETTINGS[k]; });
    work.solidity = Math.min(1, Math.max(0.05, work.solidity || DEFAULT_SETTINGS.solidity));
    settings = work; LS.set(KEYS.settings, settings);
    buildParts(); buildPalette(); refresh(); fitView(); toast('Settings saved.');
  }

  function showHelp() {
    const sc = [
      ['Place tool / Select tool', 'P / V'], ['Cycle curves', '↑ ↓'], ['Cycle straight lengths', '← →'], ['Rotate (ghost or selection)', 'R / Shift R'],
      ['Flip curve direction', 'F'], ['Toggle single / double width', 'W'], ['Add piece at active end', 'Enter'], ['Delete selection / last piece', 'Del / ⌫'],
      ['Undo / Redo', 'Ctrl Z / Ctrl ⇧ Z'], ['Save / Open', 'Ctrl S / Ctrl O'], ['Blueprint PNG', 'Ctrl E'], ['Select all', 'Ctrl A'],
      ['Pan', 'Space-drag · right/middle drag'], ['Sample tracks', '? menu'], ['Zoom', 'Wheel · + / −'], ['Fit workspace / fit track', '0 / 9'], ['Select connected chain', 'Double-click']
    ];
    modal({
      title: 'TinyTMT track designer — how to', html: `
      <p><b>Build a course:</b> pick a piece in the palette (or use the arrow keys), then click on the grid. Move the mouse near a green open end and the piece snaps onto it. Press <kbd>Enter</kbd> to keep adding the selected piece to the end you last built — the fastest way to lay a whole track.</p>
      <p><b>Edit:</b> switch to Select (<kbd>V</kbd>), click a piece, and use the arrow keys to swap it for another size — the rest of the chain follows along. Drag pieces to move them; they snap to nearby open ends.</p>
      <div class="shortcuts">${sc.map(([a, b]) => `<div><span>${a}</span><kbd>${b}</kbd></div>`).join('')}</div>
      <p class="note" style="margin-top:14px">Pieces follow the Tamiya Mini 4WD format (115 mm lane, 50 mm walls) using rucdoc's single-lane <a href="${P.SOURCES.ramp.url}" target="_blank" rel="noopener">modular ramp set</a> and <a href="${P.SOURCES.curve.url}" target="_blank" rel="noopener">curve track pack</a>. Dimensions marked nominal should be checked against the STLs. Everything runs in your browser and works offline; designs are stored locally.</p>
      <p class="note">TinyTMT is an outreach project by SalvageGarden Makerspace — a mini, motorised take on the open-source Toddler Mobility Trainer wheelchair. Open source under the MIT licence.</p>`,
      buttons: [{ label: 'Got it', primary: true }]
    });
  }

  /* ---------- add-ons ---------- */
  TinyTMT.api = {
    getDesign: () => clone(design), getParts: () => clone(parts), getSettings: () => clone(settings), geom: G,
    getDerived: () => ({ pieces: derived.pieces.map((d) => ({ id: d.p.id, part: d.part.id, partDef: clone(d.part), width: d.p.width, W: d.W, dir: d.p.dir, pose: { x: d.p.x, y: d.p.y, a: d.p.a }, z: d.z0, zExit: d.z1, outline: d.outline.map((q) => ({ x: q.x, y: q.y })), center: d.center.map((q) => ({ x: q.x, y: q.y })), length: d.length })), stats: clone(derived.stats), bom: clone(derived.bom.rows.map((r) => Object.assign({}, r, { part: undefined }))), zMin: derived.zMin, zMax: derived.zMax, workspace: derived.workspace }),
    on: (ev, fn) => TinyTMT._on(ev, fn), modal: (o) => modal(o), toast: (m) => toast(m)
  };
  function renderAddon(a) {
    const b = document.createElement('button'); b.className = 'btn addon-btn'; b.title = a.label;
    b.innerHTML = `${a.icon ? `<span>${a.icon}</span>` : ''}<span>${esc(a.label)}</span>${a.badge ? `<span class="pill">${esc(a.badge)}</span>` : ''}`;
    b.onclick = () => { try { a.run(TinyTMT.api); } catch (e) { console.error(e); toast('Add-on error: ' + e.message); } };
    $('#addonSlot').appendChild(b);
    if (typeof a.init === 'function') a.init(TinyTMT.api);
  }
  TinyTMT.addons.list.forEach(renderAddon);
  TinyTMT._on('addon-registered', (a) => { if (TinyTMT.api) { const init = a.init; a.init = null; renderAddon(a); a.init = init; } });

  /* ---------- wiring ---------- */
  $('#trackTitle').addEventListener('input', (e) => { design.title = e.target.value || 'Untitled track'; dirty = true; $('#dirtyDot').classList.add('on'); autosave(); });
  $('#trackTitle').addEventListener('blur', () => { if (!design.title.trim()) { design.title = NAMES.randomTitle(); syncControls(); } refreshSide(); });
  $('#btnRerollTitle').onclick = () => { design.title = NAMES.randomTitle(); dirty = true; syncControls(); refresh(); autosave(); };
  $('#btnNew').onclick = newTrack;
  $('#btnOpen').onclick = openLibrary;
  $('#btnSave').onclick = saveToLibrary;
  $('#btnSettings').onclick = openSettings;
  const helpMenu = $('#helpMenu');
  $('#btnHelp').onclick = (e) => { e.stopPropagation(); exportMenu.hidden = true; helpMenu.hidden = !helpMenu.hidden; $('#btnHelp').setAttribute('aria-expanded', String(!helpMenu.hidden)); };
  helpMenu.addEventListener('click', (e) => {
    const b = e.target.closest('[data-help]'); if (!b) return;
    helpMenu.hidden = true;
    ({ help: showHelp, samples: openSamples, repo: () => window.open('https://github.com/saadcaffeine/tinytmt-track-designer', '_blank', 'noopener') })[b.dataset.help]();
  });
  document.addEventListener('click', () => { helpMenu.hidden = true; });
  const exportMenu = $('#exportMenu');
  $('#btnExport').onclick = (e) => { e.stopPropagation(); helpMenu.hidden = true; exportMenu.hidden = !exportMenu.hidden; $('#btnExport').setAttribute('aria-expanded', String(!exportMenu.hidden)); };
  document.addEventListener('click', () => { exportMenu.hidden = true; });
  exportMenu.addEventListener('click', (e) => {
    const b = e.target.closest('[data-export]'); if (!b) return;
    ({ png: exportPng, json: exportJson, csv: exportCsv, import: () => $('#fileInput').click() })[b.dataset.export]();
  });
  $('#fileInput').onchange = (e) => { const f = e.target.files[0]; if (f) importFile(f); e.target.value = ''; };
  window.addEventListener('dragover', (e) => e.preventDefault());
  window.addEventListener('drop', (e) => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) importFile(f); });
  $$('[data-width]').forEach((b) => (b.onclick = () => setWidth(b.dataset.width)));
  $$('[data-dir]').forEach((b) => (b.onclick = () => { if (selection.size) { const want = b.dataset.dir; const curves = [...selection].filter((id) => derived.byId[id] && derived.byId[id].part.type === 'curve' && derived.byId[id].p.dir !== want); if (curves.length === 1) replacePiece(curves[0], { dir: want }); } ui.dir = b.dataset.dir; saveUi(); syncControls(); updateGhost(); }));
  $$('.tool[data-tool]').forEach((b) => (b.onclick = () => setTool(b.dataset.tool)));
  $('#tRotate').onclick = () => rotateSelection(1);
  $('#tFlip').onclick = flip;
  $('#tDelete').onclick = deleteSelection;
  $('#tUndo').onclick = undo; $('#tRedo').onclick = redo;
  $('#tZoomIn').onclick = () => { const r = canvas.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, 1.25); };
  $('#tZoomOut').onclick = () => { const r = canvas.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, 0.8); };
  $('#tZoomFit').onclick = () => fitView();
  $('#partSearch').addEventListener('input', buildPalette);
  $$('.tabs [data-tab]').forEach((b) => (b.onclick = () => { $$('.tabs [data-tab]').forEach((x) => x.classList.toggle('on', x === b)); $('#tab-bom').hidden = b.dataset.tab !== 'bom'; $('#tab-inspect').hidden = b.dataset.tab !== 'inspect'; }));
  $('.side').addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    ({ csv: exportCsv, copybom: copyBom, png: exportPng, rotate: () => rotateSelection(1), flip, delete: deleteSelection, chain: () => { selection = chainOf([...selection][0]); refresh(); } })[b.dataset.act]();
  });
  window.addEventListener('beforeunload', () => LS.set(KEYS.current, { design, dirty }));

  /* ---------- boot ---------- */
  buildParts();
  const saved = LS.get(KEYS.current, null);
  design = saved && saved.design && Array.isArray(saved.design.pieces) ? saved.design : newDesign();
  dirty = !!(saved && saved.dirty);
  derived = derive();
  buildPalette(); syncControls(); setTool(ui.tool === 'select' ? 'select' : 'place');
  requestAnimationFrame(() => { design.pieces.length ? fitToTrack() : fitView(); refresh(); if (design.pieces.length) activeEnd = { pid: design.pieces[design.pieces.length - 1].id, end: 1 }; render(); });
  if (!LS.get('tinytmt.seenHelp', false)) { LS.set('tinytmt.seenHelp', true); setTimeout(showHelp, 400); }
  window.__tinytmt = { get design() { return design; }, get derived() { return derived; }, appendAtActiveEnd, setActivePart, cycle, undo, redo, exportPng, saveToLibrary, view, fitView, toWorld, placeGhost, updateGhost, setTool, get ghost() { return ghost; } };
})();

</script>
  <script>
/*
 * Placeholder for the planned "View in 3D" add-on.
 * Replace this file (or add a new one) with a real viewer, e.g. three.js extruding
 * api.getDerived().pieces[i].outline at each piece's elevation (z / zExit).
 */
TinyTMT.addons.register({
  id: 'view3d',
  label: 'View in 3D',
  icon: '🧊',
  badge: 'Soon',
  run(api) {
    const d = api.getDerived();
    api.modal({
      title: 'View in 3D — coming soon',
      html: `
        <p>A 3D preview is planned as an add-on. The hook is already in place: any script that calls
        <code>TinyTMT.addons.register({...})</code> gets a toolbar button and read access to the design.</p>
        <p>This design currently has <b>${d.pieces.length}</b> pieces, with elevations from
        <b>${Math.round(d.zMin)} mm</b> to <b>${Math.round(d.zMax)} mm</b>.</p>
        <p class="note">See <code>js/addons.js</code> for the API and <code>addons/view3d-placeholder.js</code> for this stub.</p>`,
      buttons: [{ label: 'OK', primary: true }]
    });
  }
});

</script>
  <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>

name: Deploy to salvage.garden
on:
  push:
    branches: [main]
  workflow_dispatch:        # also adds a manual "Run workflow" button

jobs:
  ftp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps              # use "ftp" if your host doesn't support FTPS
          server-dir: /tinytmt-trackdesigner/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            tools/**
